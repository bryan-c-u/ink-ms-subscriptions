spring:
  mongodb:
    uri: mongodb://localhost:27017/inklusport_subscriptions_test
    database: inklusport_subscriptions_test
  data:
    mongodb:
      # Sin creación de índices el contexto de Spring arranca sin conectarse a Mongo, que
      # es lo único que necesitan las pruebas (unitarias con Mockito y @WebMvcTest).
      auto-index-creation: false
  mail:
    host: localhost
    port: 3025
    username: test@test.com
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

jwt:
  secret: inklusport2024superSecretKeyForJWTtokenGenerationWith512bitsAlgorithmHS512
  expiration: 3600000

mercadopago:
  access-token: TEST-access-token
  public-key: TEST-public-key

app:
  comprobantes:
    storage-path: ./target/test-comprobantes
