spring:
  datasource:
    url: jdbc:h2:mem:subscriptions_test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        # Sobreescribe el MySQLDialect heredado de application.yaml: H2 no entiende la
        # sintaxis MySQL (auto_increment, engine=InnoDB) que ese dialecto genera.
        dialect: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 3025
    username: test@test.com
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

jwt:
  secret: inklusport2024superSecretKeyForJWTtokenGenerationWith512bitsAlgorithmHS512
  expiration: 3600000

mercadopago:
  access-token: TEST-access-token
  public-key: TEST-public-key

app:
  comprobantes:
    storage-path: ./target/test-comprobantes
